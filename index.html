<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Urna Online IDPB-MG</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--fg:#111827;--mut:#5b6474;--line:#e3e7ee;--pri:#2559d9;--ok:#0f9d6b;--okbg:#e5f6ef;--bad:#dc2626;--badbg:#fdecec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141c;--card:#18202b;--fg:#eef2f7;--mut:#9aa5b5;--line:#2a3442;--okbg:#103a2c;--badbg:#3d1717}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--pri);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;justify-content:space-between}
header h1{font-size:17px;margin:0}header small{opacity:.85;display:block;font-size:12px}
main{max-width:520px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
h2{font-size:20px;margin:0 0 6px}p{margin:6px 0;color:var(--mut)}
input.big{width:100%;font-size:24px;letter-spacing:2px;text-align:center;padding:14px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg)}
button{font:inherit;cursor:pointer;border:none;border-radius:12px;padding:14px 16px;font-weight:700;width:100%;margin-top:10px}
.pri{background:var(--pri);color:#fff}.ok{background:var(--ok);color:#fff}.sec{background:var(--line);color:var(--fg)}.lend{background:#fff;color:var(--pri);width:auto;margin:0;padding:8px 12px;font-size:13px}
.op{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:12px;padding:14px;margin-top:10px;cursor:pointer;font-weight:700;font-size:17px}
.op input{width:22px;height:22px}.op.sel{border-color:var(--pri);background:rgba(37,89,217,.08)}.op.br{font-weight:500;color:var(--mut)}
.msg{padding:14px;border-radius:12px;font-weight:600}.msg.ok{background:var(--okbg);color:var(--ok)}.msg.bad{background:var(--badbg);color:var(--bad)}
.big-ico{font-size:54px;text-align:center}.err{color:var(--bad);font-weight:600;min-height:22px;margin-top:8px}
.muted{font-size:13px;color:var(--mut)}
</style></head><body>
<header><div><h1>🗳️ Urna Online · IDPB-MG</h1><small>Convenção 2026 · cargos eletivos</small></div><button class="lend" id="btn-lend" style="display:none" onclick="emprestar()">📱 Emprestar celular</button></header>
<main id="app"></main>
<script>
function sha256(str){var b=new TextEncoder().encode(str),K=[],H=[],p=2,i,j;function isP(n){for(var f=2;f*f<=n;f++)if(n%f===0)return false;return true}
for(var c=0;c<64;p++)if(isP(p)){if(c<8)H[c]=(Math.pow(p,1/2)*4294967296)|0;K[c++]=(Math.pow(p,1/3)*4294967296)|0}
var l=b.length,w=new Uint8Array(((l+9+63)>>6)<<6);w.set(b);w[l]=0x80;var bl=l*8,dv=new DataView(w.buffer);dv.setUint32(w.length-4,bl>>>0);dv.setUint32(w.length-8,Math.floor(bl/4294967296));
var W=new Array(64);function r(x,n){return(x>>>n)|(x<<(32-n))}
for(i=0;i<w.length;i+=64){for(j=0;j<16;j++)W[j]=dv.getUint32(i+j*4);for(j=16;j<64;j++){var s0=r(W[j-15],7)^r(W[j-15],18)^(W[j-15]>>>3),s1=r(W[j-2],17)^r(W[j-2],19)^(W[j-2]>>>10);W[j]=(W[j-16]+s0+W[j-7]+s1)|0}
var a=H[0],bb=H[1],cc=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
for(j=0;j<64;j++){var S1=r(e,6)^r(e,11)^r(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[j]+W[j])|0,S0=r(a,2)^r(a,13)^r(a,22),mj=(a&bb)^(a&cc)^(bb&cc),t2=(S0+mj)|0;h=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=bb;bb=a;a=(t1+t2)|0}
H[0]=(H[0]+a)|0;H[1]=(H[1]+bb)|0;H[2]=(H[2]+cc)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0}
return H.map(function(x){return('00000000'+(x>>>0).toString(16)).slice(-8)}).join('')}

const FB = 'https://plenaria-idpb-default-rtdb.firebaseio.com', PATH = 'plenaria_mg2026', SAL = 'idpbmg2026:';
const q = new URLSearchParams(location.search), fbUrl = q.get('fb') || FB, fbPath = q.get('p') || PATH;
const url = s => `${fbUrl}/${fbPath}/${s}.json`;
let ultimaSig = '', eleit = {}, eu = null, aberta = null, presente = false, jaVotou = false, escolha = null, tela = 'id', candTemp = null, carregando = true, erroRede = false;
try { eu = sessionStorage.getItem('urna_eu') || null; } catch (e) {}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
async function get(s) { const r = await fetch(url(s), { cache: 'no-store' }); if (!r.ok) throw new Error(r.status); return r.json(); }
async function carregar() {
  try {
    const [el, ab, z] = await Promise.all([get('urna/eleitores'), get('urna/aberta'), get('zero')]);
    eleit = el || {}; aberta = ab && ab.id ? ab : null;
    if (eu && eleit[eu]) {
      const p = await get('pres/' + eu); const ep = (z && z.e) || 0;
      presente = !!(p && p.e === ep && p.s === 'present');
      jaVotou = aberta ? !!(await get('urna/votou/' + aberta.id + '/' + eu)) : false;
    }
    erroRede = false;
  } catch (e) { erroRede = true; }
  const sig = JSON.stringify([eu, aberta && aberta.id, aberta && aberta.cands, presente, jaVotou, erroRede, tela]);
  const primeira = carregando; carregando = false;
  // só redesenha se algo mudou: assim o que a pessoa está digitando (CPF) ou marcando não se perde
  if (tela !== 'confirma' && (primeira || sig !== ultimaSig)) { ultimaSig = sig; render(); }
}
function render() {
  const a = document.getElementById('app'); document.getElementById('btn-lend').style.display = eu ? '' : 'none';
  if (carregando) { a.innerHTML = '<div class="card"><p>Carregando…</p></div>'; return; }
  const rede = erroRede ? '<div class="msg bad" style="margin-bottom:12px">Sem conexão. Tentando de novo…</div>' : '';
  if (!eu || !eleit[eu]) {
    if (tela === 'quem' && candTemp) { a.innerHTML = rede + `<div class="card"><h2>É você?</h2><p style="font-size:20px;color:var(--fg);font-weight:800">${esc(eleit[candTemp].n)}</p>${eleit[candTemp].r ? `<p>${eleit[candTemp].r}ª Região</p>` : ''}<button class="ok" onclick="confirmarEu()">Sim, sou eu</button><button class="sec" onclick="tela='id';candTemp=null;render()">Não sou eu</button></div>`; return; }
    a.innerHTML = rede + `<div class="card"><h2>Identifique-se</h2><p>Digite seu <b>CPF</b> (só números) ou o <b>código de 6 dígitos</b> entregue pela mesa.</p>
      <input class="big" id="ident" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="CPF ou código" onkeydown="if(event.key==='Enter')identificar()">
      <div class="err" id="err"></div><button class="pri" onclick="identificar()">Entrar</button></div>
      <p class="muted">Só votam os pastores aptos e presentes na plenária. Cada pessoa vota uma vez por cargo.</p>`;
    setTimeout(() => { const i = document.getElementById('ident'); if (i) i.focus(); }, 50); return;
  }
  if (eleit[eu].v) { emprestar(true); return; }
  const me = eleit[eu], topo = `<div class="card"><p class="muted" style="margin:0">Eleitor</p><div style="font-weight:800;font-size:18px">${esc(me.n)}</div>${me.r ? `<div class="muted">${me.r}ª Região</div>` : ''}</div>`;
  if (tela === 'votado') { a.innerHTML = rede + topo + `<div class="card"><div class="big-ico">✅</div><h2 style="text-align:center">Voto registrado</h2><p style="text-align:center">${esc(aberta ? aberta.c : '')}</p><button class="pri" onclick="emprestar(true)">📱 Passar o celular para o próximo pastor</button><button class="sec" onclick="tela='';render()">Continuar com meu acesso</button></div>`; return; }
  if (!presente) { a.innerHTML = rede + topo + `<div class="card"><div class="msg bad">Você não está registrado como presente na plenária. Procure a mesa de registro.</div><button class="sec" onclick="carregar()">Verificar de novo</button></div>`; return; }
  if (!aberta) { a.innerHTML = rede + topo + `<div class="card"><div class="big-ico">⏳</div><h2 style="text-align:center">Aguardando a votação</h2><p style="text-align:center">Quando a mesa abrir a votação de um cargo, ele aparece aqui automaticamente.</p></div>`; return; }
  if (aberta.reg && me.r !== aberta.reg) { a.innerHTML = rede + topo + `<div class="card"><h2>${esc(aberta.c)}</h2><p>${esc(aberta.g || '')}</p><div class="msg bad">Esta votação é só para os pastores da ${aberta.reg}ª Região.</div></div>`; return; }
  if (jaVotou) { a.innerHTML = rede + topo + `<div class="card"><h2>${esc(aberta.c)}</h2><div class="msg ok">✔ Você já votou neste cargo. Aguarde o próximo.</div></div>`; return; }
  if (tela === 'confirma') {
    a.innerHTML = rede + topo + `<div class="card"><h2>Confirme seu voto</h2><p>${esc(aberta.c)}</p><p style="font-size:22px;color:var(--fg);font-weight:800;margin:14px 0">${escolha === '__branco' ? 'Voto em branco' : escolha === '__abst' ? 'Abstenção' : esc(escolha)}</p><div class="err" id="err"></div><button class="ok" id="btn-conf" onclick="votar()">✔ Confirmar voto</button><button class="sec" onclick="tela='';render()">Voltar e corrigir</button></div>`; return;
  }
  const cs = (aberta.cands || []).slice().sort((x, y) => x.localeCompare(y, 'pt'));
  if (escolha && escolha !== '__abst' && !cs.includes(escolha)) escolha = null;
  a.innerHTML = rede + topo + `<div class="card"><p class="muted" style="margin:0">${esc(aberta.g || '')}</p><h2>${esc(aberta.c)}</h2><p>Escolha um candidato:</p>
    ${cs.map((c, i) => `<label class="op${escolha === c ? ' sel' : ''}"><input type="radio" name="v" ${escolha === c ? 'checked' : ''} onchange="escolha=this.dataset.v;render()" data-v="${esc(c)}">${esc(c)}</label>`).join('')}
    <label class="op br${escolha === '__abst' ? ' sel' : ''}"><input type="radio" name="v" ${escolha === '__abst' ? 'checked' : ''} onchange="escolha='__abst';render()">⏸ Abstenção</label>
    <button class="pri" ${escolha ? '' : 'disabled style="opacity:.5"'} onclick="tela='confirma';render()">Continuar</button></div>`;
}
function identificar() {
  const d = (document.getElementById('ident').value || '').replace(/\D/g, ''), err = document.getElementById('err');
  if (d.length !== 11 && d.length !== 6) { err.textContent = 'Digite os 11 números do CPF ou o código de 6 dígitos.'; return; }
  const h = d.length === 11 ? sha256(SAL + d) : sha256(SAL + 'k' + d), campo = d.length === 11 ? 'h' : 'k';
  const id = Object.keys(eleit).find(k => eleit[k][campo] === h);
  if (!id) { err.textContent = d.length === 11 ? 'CPF não encontrado na lista de inscritos. Tente o código da mesa.' : 'Código não encontrado. Confira com a mesa.'; return; }
  if (eleit[id].v) { err.innerHTML = '<b>' + esc(eleit[id].n) + '</b> está inscrito(a) como <b>visitante</b>. Visitantes não têm direito a voto.'; return; }
  candTemp = id; tela = 'quem'; render();
}
function confirmarEu() { eu = candTemp; candTemp = null; tela = ''; escolha = null; try { sessionStorage.setItem('urna_eu', eu); } catch (e) {} carregando = true; render(); carregar(); }
function emprestar(direto) {
  if (!direto && !confirm('Sair do seu acesso para outro pastor votar neste celular?')) return;
  eu = null; escolha = null; tela = 'id'; jaVotou = false; presente = false; try { sessionStorage.removeItem('urna_eu'); } catch (e) {} render();
}
async function votar() {
  const b = document.getElementById('btn-conf'); b.disabled = true; b.textContent = 'Enviando…';
  try {
    const ab = await get('urna/aberta');
    if (!ab || ab.id !== aberta.id) { aberta = ab && ab.id ? ab : null; tela = ''; render(); alert('A votação deste cargo foi encerrada.'); return; }
    if (await get('urna/votou/' + aberta.id + '/' + eu)) { jaVotou = true; tela = ''; render(); return; }
    // chave aleatória (não identifica o eleitor) e reaproveitada se a conexão cair no meio: o voto nunca conta duas vezes
    const pk = 'urna_pend_' + aberta.id + '_' + eu; let chave = null; try { chave = sessionStorage.getItem(pk); } catch (e) {}
    if (!chave) { chave = 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); try { sessionStorage.setItem(pk, chave); } catch (e) {} }
    let r = await fetch(url('urna/votos/' + aberta.id + '/' + chave), { method: 'PUT', body: JSON.stringify({ v: escolha }) }); if (!r.ok) throw 0;
    r = await fetch(url('urna/votou/' + aberta.id + '/' + eu), { method: 'PUT', body: JSON.stringify(Date.now()) }); if (!r.ok) throw 0;
    try { sessionStorage.removeItem(pk); } catch (e) {}
    jaVotou = true; escolha = null; tela = 'votado'; render();
  } catch (e) { b.disabled = false; b.textContent = '✔ Confirmar voto'; document.getElementById('err').textContent = 'Falha de conexão. Toque em confirmar de novo.'; }
}
render(); carregar(); setInterval(() => { if (tela !== 'confirma' && tela !== 'quem') carregar(); }, 3000);
</script></body></html>
